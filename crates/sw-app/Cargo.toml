[package]
name = "sw-app"
description = "SampleWright desktop app: separate songs into stems and cut loops and one-shots for your DAW"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "samplewright"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
cpal = "0.18"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
serde.workspace = true
rayon.workspace = true
sw-core = { path = "../sw-core" }
sw-audio = { path = "../sw-audio" }
sw-models = { path = "../sw-models" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
